name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-reels-creator/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android-reels-creator/**/*.gradle*', 'android-reels-creator/**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Build debug APK
        working-directory: android-reels-creator
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reels-creator-debug
          path: android-reels-creator/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish rolling release
      if: github.ref == 'refs/heads/main'
      env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
    cp android-reels-creator/app/build/outputs/apk/debug/app-debug.apk reels-creator-${GITHUB_SHA::7}.apk
    gh release delete latest-android --yes --cleanup-tag 2>/dev/null || true
    sleep 2
    gh release create latest-android \
      reels-creator-${GITHUB_SHA::7}.apk \
      --title "Reels Creator (latest debug build)" \
      --notes "Auto-built from commit ${GITHUB_SHA::7}. Download the .apk, transfer to phone, enable Install unknown apps for your file manager, tap to install." \
      --prerelease
