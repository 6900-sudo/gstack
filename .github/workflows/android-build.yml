name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-reels-creator/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android-reels-creator/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ANDROID_PROJECT_DIR: android-reels-creator

jobs:
  build:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-reels-creator
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Write build summary
        if: always()
        run: |
          {
            echo '## Android build'
            echo
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Java: \$(java -version 2>&1 | head -n 1)"
            echo "- Gradle: \$(./gradlew --version --no-daemon | awk '/Gradle / { print \$2; exit }')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reels-creator-debug-${{ github.sha }}
          path: android-reels-creator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish rolling debug release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: reels-creator-debug-${{ github.sha }}
          path: release

      - name: Publish latest prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: release/android-reels-creator/app/build/outputs/apk/debug/app-debug.apk
          SHORT_SHA: ${{ github.sha }}
        run: |
          apk_name="reels-creator-${SHORT_SHA::7}.apk"
          mv "$APK_PATH" "$apk_name"
          gh release delete latest-android --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-android "$apk_name" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Reels Creator (latest debug build)' \
            --notes "Auto-built from commit ${SHORT_SHA::7}. Download the APK, transfer it to a phone, enable Install unknown apps for the file manager, and tap the APK to install." \
            --prerelease

      - name: Add release link to summary
        run: |
          echo "Latest release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/latest-android" >> "$GITHUB_STEP_SUMMARY"
