name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-reels-creator/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android-reels-creator/**/*.gradle*', 'android-reels-creator/**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Build debug APK
        working-directory: android-reels-creator
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reels-creator-debug
          path: android-reels-creator/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
